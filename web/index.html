<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEAVE · Cultural Bridge Engine</title>
<style>
:root{--bg:#0c0e13;--panel:#151923;--line:#262c3a;--text:#eef1f7;--muted:#9ba4b6;--violet:#8f7ff7;--amber:#f5b84b;--teal:#5eead4;--ok:#6ee7a8;--bad:#fca5a5;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#1d1846 0%,transparent 60%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:16px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.wordmark{font-size:34px;font-weight:800;letter-spacing:.18em;background:linear-gradient(90deg,var(--violet),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:2px 0 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:16px;margin:0 0 12px;letter-spacing:.02em}
h3{font-size:15px;margin:0 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,button{font:inherit;color:var(--text);background:#0e1119;border:1px solid #3a4258;border-radius:10px;padding:7px 10px;min-width:0}
button{cursor:pointer}
button.primary{background:var(--violet);border-color:var(--violet);color:#0c0e13;font-weight:700}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.community{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #3a4258;border-radius:999px;padding:2px 10px;font-size:13px;background:#0e1119}
.chip.bridge{border-color:var(--amber);color:var(--amber)}
.chip.recognition{border-color:var(--violet);color:var(--violet)}
.chip.co-creation{border-color:var(--teal);color:var(--teal)}
.chip.break{color:var(--muted)}
.x{border:0;background:none;padding:0;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.pill.demo{border-color:var(--amber);color:var(--amber)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.bad{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--muted)}
.err{color:var(--bad);margin:4px 0}
.warn{color:var(--amber);margin:4px 0}
.alert{border:1px solid var(--bad);color:#ffe4e4;border-radius:12px;padding:10px 12px}
svg{width:100%;height:auto;display:block;margin-top:4px}
svg text{fill:var(--text);font-size:12.5px}
.comm{fill:#1f1a40;stroke:var(--violet);stroke-width:2}
.node{cursor:pointer}
.node circle{fill:#0e1119;stroke:var(--teal);stroke-width:2}
.node.picked circle{fill:var(--teal)}
.node.focus circle{stroke:var(--amber);stroke-width:3}
.edge{stroke:#3a4258;stroke-width:1.5}
.edge-bridge{stroke:var(--amber);stroke-width:2.2;opacity:.85}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.evidence{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#11151f}
.evidence p{margin:4px 0}
.bar{display:flex;height:30px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.seg{height:100%}
.seg.bridge{background:var(--amber)}
.seg.recognition{background:var(--violet)}
.seg.co-creation{background:var(--teal)}
.seg.break{background:#3a4258}
.seg.buffer{background:repeating-linear-gradient(45deg,transparent 0 6px,#2a3042 6px 12px)}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.seg-row{display:grid;grid-template-columns:150px 1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.seg-row input{width:90px}
.seg-row small{grid-column:1/-1}
pre{white-space:pre-wrap;overflow-x:auto;background:#0e1119;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:280px}
.baseline{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.search{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.search input{flex:1;min-width:140px}
.results{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.results li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px}
.toggle{display:inline-flex;border:1px solid #3a4258;border-radius:10px;overflow:hidden}
.toggle button{border:0;border-radius:0;background:#0e1119}
.toggle button[aria-pressed="true"]{background:var(--violet);color:#0c0e13;font-weight:700}
.notice{border:1px solid var(--amber);color:#ffe9b3;border-radius:12px;padding:10px 12px}
.inspector{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:12px 0}
.inspector p{margin:4px 0}
.exports pre{margin-top:10px}
@media (max-width:640px){.seg-row{grid-template-columns:1fr auto}.wordmark{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.edge-bridge{transition:opacity .2s}}
</style>
</head>
<body>
<main id="app"><noscript>WEAVE needs JavaScript to run the demo.</noscript></main>
<script type="module">
/*@@BUNDLE@@*/
</script>
</body>
</html>
